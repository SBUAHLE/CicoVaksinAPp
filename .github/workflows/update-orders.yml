
name: Update Orders JSON

on:
  repository_dispatch:
    types: [orders_update]

permissions:
  contents: write   # wajib agar git push berhasil

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure data folder exists
        run: mkdir -p data

      - name: Write JSON file
        env:
          PAYLOAD_CONTENT: ${{ github.event.client_payload.content }}
          TARGET_PATH: ${{ github.event.client_payload.path }}
        run: |
          echo "$PAYLOAD_CONTENT" > "$TARGET_PATH"
          echo "Updated: $TARGET_PATH"

      - name: Commit & push changes
        run: |
          if git status --porcelain | grep .; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update: ${{ github.event.client_payload.path }} (requestId=${{ github.event.client_payload.requestId }})"
            git push
          else
            echo "No changes to commit."
          fi
